<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Clatch app icon. SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3A27C"/>
      <stop offset="1" stop-color="#C8603C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFF4EE" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A2412" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS squircle-ish plate inside the 1024 canvas (824 px, 100 px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- Back account -->
  <g filter="url(#shadow)" opacity="0.62">
    <circle cx="626" cy="404" r="92" fill="url(#glass)"/>
    <path d="M466 690 a160 150 0 0 1 320 0 v22 h-320 z" fill="url(#glass)"/>
  </g>
  <!-- Front account -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="440" r="110" fill="url(#glass)"/>
    <path d="M226 770 a194 178 0 0 1 388 0 v26 h-388 z" fill="url(#glass)"/>
  </g>
  <!-- Switch arrows -->
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M700 600 h110"/>
    <path d="M770 556 l44 44 l-44 44"/>
    <path d="M810 730 h-110"/>
    <path d="M740 686 l-44 44 l44 44"/>
  </g>
</svg>
