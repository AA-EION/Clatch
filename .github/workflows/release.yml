# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: push a v* tag to publish a DMG.
#
#   Stable:      git tag -a v1.0.0 -m "Clatch 1.0.0"               && git push origin v1.0.0
#   Prerelease:  git tag -a v1.0.0-beta.1 -m "Clatch 1.0.0 beta 1" && git push origin v1.0.0-beta.1
#
# A tag with a suffix (v1.0.0-beta.1, v1.0.0-rc.1) publishes a GitHub
# *prerelease*, which may be built without signing secrets (ad-hoc signed, not
# notarized). Stable tags require these repository secrets:
#   MACOS_CERTIFICATE_P12        base64 of "Developer ID Application" cert + key (.p12)
#   MACOS_CERTIFICATE_PASSWORD   .p12 export password
#   NOTARY_KEY_P8                base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID                that key's ID
#   NOTARY_ISSUER_ID             App Store Connect issuer ID

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v0.1.0-beta.1"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Classify tag; version must match VERSION
        id: tag
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "::error::tag must look like v1.2.3[-suffix]"; exit 1 ;; esac
          tag_ver="${RELEASE_TAG#v}"
          base_ver="${tag_ver%%-*}"
          file_ver="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${tag_ver} base=${base_ver} VERSION=${file_ver}"
          [ "$base_ver" = "$file_ver" ] || { echo "::error::tag and VERSION differ"; exit 1; }
          if [ "$tag_ver" != "$base_ver" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "$HAS_CERT" = true ] && [ "$HAS_NOTARY" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = true ]; then
            echo "::warning::No signing secrets: publishing an ad-hoc signed, un-notarized prerelease"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Stable releases need MACOS_CERTIFICATE_P12 and the NOTARY_* secrets"
            exit 1
          fi

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Import signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build universal app
        env:
          CLATCH_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Disk image
        env:
          NOTARY_KEY_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
        run: ./scripts/make-dmg.sh

      - name: Release notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          dmg="$(ls dist/Clatch-*.dmg)"
          dmg_name="$(basename "$dmg")"
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          {
            if [ "$SIGNED" != true ]; then
              echo '> [!WARNING]'
              echo '> **Test build: not signed with a Developer ID and not notarized by Apple.**'
              echo '> macOS will block it the first time. After copying Clatch to Applications, open'
              echo '> *System Settings › Privacy & Security* and click **Open Anyway**, or run:'
              echo '> `xattr -dr com.apple.quarantine /Applications/Clatch.app`'
              echo
            fi
            sed -e "s/{{DMG_NAME}}/${dmg_name}/g" \
                -e "s/{{SHA256}}/${sha256}/g" \
                -e "s/{{TAG}}/${RELEASE_TAG}/g" \
                .github/RELEASE_TEMPLATE.md
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            --title "Clatch $RELEASE_TAG" \
            --notes-file notes.md --generate-notes \
            "${flags[@]}" dist/Clatch-*.dmg
          echo "Published: $(gh release view "$RELEASE_TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
