# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: builds the macOS DMG and the Windows installer and publishes both.
#
#   Stable:      git tag -a v1.0.0 -m "Clatch 1.0.0"               && git push origin v1.0.0
#   Prerelease:  git tag -a v1.0.0-beta.1 -m "Clatch 1.0.0 beta 1" && git push origin v1.0.0-beta.1
#
# Or run it from the Actions tab with a tag name; it creates the tag on the
# selected commit. "replace" rebuilds an existing release in place (same tag,
# moved to the new commit), e.g. to refresh a prerelease.
#
# A tag with a suffix (v1.0.0-beta.1) publishes a GitHub *prerelease*, which
# may be unsigned. Stable tags need these secrets for the Mac build:
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD   Developer ID Application (.p12, base64)
#   NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID       App Store Connect API key

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0-beta.1"
        required: true
        type: string
      replace:
        description: "Replace the release (and move the tag) if it already exists"
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  meta:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - name: Classify tag; version must match VERSION
        id: tag
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "::error::tag must look like v1.2.3[-suffix]"; exit 1 ;; esac
          tag_ver="${RELEASE_TAG#v}"
          base_ver="${tag_ver%%-*}"
          file_ver="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${tag_ver} base=${base_ver} VERSION=${file_ver}"
          [ "$base_ver" = "$file_ver" ] || { echo "::error::tag and VERSION differ"; exit 1; }
          if [ "$tag_ver" != "$base_ver" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "$HAS_CERT" = true ] && [ "$HAS_NOTARY" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = true ]; then
            echo "::warning::No signing secrets: publishing an unsigned prerelease"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Stable releases need MACOS_CERTIFICATE_P12 and the NOTARY_* secrets"
            exit 1
          fi

  macos:
    name: macOS DMG
    needs: meta
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version
      - name: Unit tests
        run: swift test
      - name: Import signing certificate
        if: needs.meta.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh
      - name: Build universal app
        env:
          CLATCH_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh
      - name: Disk image
        env:
          NOTARY_KEY_ID: ${{ needs.meta.outputs.signed == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ needs.meta.outputs.signed == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Clatch-*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./windows/scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/out/Clatch-*-windows-setup.exe
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    needs: [meta, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Release notes
        env:
          SIGNED: ${{ needs.meta.outputs.signed }}
        run: |
          dmg="$(ls assets/Clatch-*.dmg)"; exe="$(ls assets/Clatch-*-windows-setup.exe)"
          {
            if [ "$SIGNED" != true ]; then
              echo '> [!WARNING]'
              echo '> **Test build: not signed.** macOS will block the app the first time: after copying it to'
              echo '> Applications, open *System Settings › Privacy & Security* and click **Open Anyway**, or run'
              echo '> `xattr -dr com.apple.quarantine /Applications/Clatch.app`.'
              echo '> On Windows, SmartScreen may say it "protected your PC": click **More info › Run anyway**.'
              echo
            fi
            sed -e "s/{{DMG_NAME}}/$(basename "$dmg")/g" \
                -e "s/{{DMG_SHA256}}/$(sha256sum "$dmg" | awk '{print $1}')/g" \
                -e "s/{{EXE_NAME}}/$(basename "$exe")/g" \
                -e "s/{{EXE_SHA256}}/$(sha256sum "$exe" | awk '{print $1}')/g" \
                -e "s/{{TAG}}/${RELEASE_TAG}/g" \
                .github/RELEASE_TEMPLATE.md
          } > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" = true ]; then
              echo "Replacing the existing $RELEASE_TAG release"
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            else
              echo "::error::$RELEASE_TAG already exists; run with replace to rebuild it"; exit 1
            fi
          fi
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then flags+=(--target "$GITHUB_SHA"); else flags+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" --title "Clatch $RELEASE_TAG" \
            --notes-file notes.md --generate-notes "${flags[@]}" assets/*
          echo "Published: $(gh release view "$RELEASE_TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
