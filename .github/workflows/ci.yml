# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI: build, test and package on real macOS runners.
#
# GitHub's macOS runners are Apple silicon VMs, plus an Intel image
# (macos-15-intel) used to prove the universal app really runs on x86_64
# hardware, not just under Rosetta.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]  # release.yml handles tags
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Universal app + DMG, unit tests on both architectures.
  # Signed + notarized when the repository has signing secrets (not on pull
  # requests); otherwise ad-hoc signed so the whole pipeline still runs.
  # ----------------------------------------------------------------------------
  package:
    name: Build, test, package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version; swift --version; sw_vers; uname -m

      - name: Unit tests (arm64)
        run: swift test

      - name: Import signing certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build universal app
        env:
          CLATCH_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/make-dmg.sh

      - name: Launch smoke test
        run: |
          app=dist/Clatch.app
          "$app/Contents/MacOS/Clatch" & pid=$!
          sleep 6
          kill -0 "$pid" || { echo "::error::Clatch exited early"; exit 1; }
          kill "$pid"

      - uses: actions/upload-artifact@v4
        with:
          name: Clatch-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Unit tests natively on Intel (SwiftPM cannot run x86_64 test bundles under
  # Rosetta on Apple silicon runners).
  # ----------------------------------------------------------------------------
  tests-intel:
    name: Unit tests · macos-15-intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version; swift --version; uname -m
      - name: Unit tests (x86_64)
        run: swift test

  # ----------------------------------------------------------------------------
  # Install the DMG on Intel and on the previous macOS, and launch the app.
  # ----------------------------------------------------------------------------
  install-smoke:
    name: DMG · ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clatch-dmg
      - name: Mount, copy to /Applications, launch
        run: |
          sw_vers; uname -m
          dmg="$(ls Clatch-*.dmg)"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          ls -la "$mnt"
          ditto "$mnt/Clatch.app" /Applications/Clatch.app
          hdiutil detach "$mnt"
          app=/Applications/Clatch.app
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/Clatch"
          "$app/Contents/MacOS/Clatch" & pid=$!
          sleep 8
          kill -0 "$pid" || { echo "::error::Clatch exited early on $(uname -m)"; exit 1; }
          ps -o rss=,command= -p "$pid" | awk '{printf "resident memory: %.1f MB\n", $1/1024}'
          kill "$pid"

  # ----------------------------------------------------------------------------
  # Windows: unit tests, x64 + ARM64 apps (NativeAOT), one installer.
  # ----------------------------------------------------------------------------
  windows:
    name: Windows · build, test, installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./windows/scripts/build.ps1
      - name: Launch smoke test (x64)
        shell: pwsh
        run: |
          $p = Start-Process windows/out/win-x64/Clatch.exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw "Clatch exited early (code $($p.ExitCode))" }
          $p.Refresh()
          "resident memory: {0:N1} MB" -f ($p.WorkingSet64 / 1MB)
          Stop-Process $p
      - name: Panel and menu open from the icon (UI smoke test)
        shell: pwsh
        run: ./windows/scripts/ui-smoke.ps1 -Exe windows/out/win-x64/Clatch.exe -Shots windows/out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-screenshots
          path: windows/out/shots/*.png
          if-no-files-found: warn
      - name: Real switch against a stand-in Claude (end-to-end)
        shell: pwsh
        run: ./windows/scripts/switch-test.ps1 -Exe windows/out/win-x64/Clatch.exe
      - name: Install with the installer, launch
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows/out/Clatch-*-windows-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Clatch\Clatch.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $p = Start-Process $exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) { throw "installed Clatch exited early (code $($p.ExitCode))" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: Clatch-windows
          path: windows/out/Clatch-*-windows-setup.exe
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Windows on ARM: install with the real installer (which picks the ARM64
  # build) and run the panel test and the end-to-end switch test natively.
  # ----------------------------------------------------------------------------
  windows-arm:
    name: Windows ARM64 · install, panel, switch
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Clatch-windows
          path: setup
      - name: Install (per user, no admin)
        shell: pwsh
        run: |
          $env:PROCESSOR_ARCHITECTURE
          $setup = Get-ChildItem setup/Clatch-*-windows-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Clatch\Clatch.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          # The installed binary must be the native ARM64 one (PE machine 0xAA64).
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          "Clatch.exe machine: 0x{0:X4}" -f $machine
          if ($machine -ne 0xAA64) { throw 'the installer did not install the ARM64 build' }
          Get-Process Clatch -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Panel and menu open from the icon
        shell: pwsh
        run: ./windows/scripts/ui-smoke.ps1 -Exe "$env:LOCALAPPDATA\Programs\Clatch\Clatch.exe" -Shots shots
      - name: Real switch against a stand-in Claude
        shell: pwsh
        run: ./windows/scripts/switch-test.ps1 -Exe "$env:LOCALAPPDATA\Programs\Clatch\Clatch.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm-screenshots
          path: shots/*.png
          if-no-files-found: warn

  # ----------------------------------------------------------------------------
  # What people see when they open the DMG (diagnostic, never fails the build).
  # ----------------------------------------------------------------------------
  dmg-look:
    name: DMG window screenshot
    needs: package
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Clatch-dmg
      - name: Open in Finder and screenshot
        run: |
          mkdir -p shots
          dmg="$(ls Clatch-*.dmg)"
          mnt="$(hdiutil attach -readonly -noautoopen "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          open "$mnt"; sleep 8
          screencapture -x shots/dmg-window.png || true
          osascript -e 'tell application "Finder" to close every window' || true
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-window
          path: shots/*.png
          if-no-files-found: warn
